<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Página não encontrada · Sites Úteis em 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,900&family=Spline+Sans:wght@400;500&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea; --ink: #1a1814; --ink-soft: #4a463e;
      --accent: #9a3412; --link: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14130f; --ink: #f0ebe0; --ink-soft: #c4bdaf; --accent: #fb923c; --link: #93c5fd; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: "Spline Sans", system-ui, sans-serif;
      display: grid; place-items: center; text-align: center; padding: 2rem;
    }
    .code {
      font-family: "Fraunces", serif; font-weight: 900;
      font-size: clamp(5rem, 22vw, 11rem); line-height: 0.9;
      color: var(--accent); letter-spacing: -0.04em; margin: 0;
    }
    h1 {
      font-family: "Fraunces", serif; font-weight: 400; font-style: italic;
      font-size: clamp(1.4rem, 4vw, 2rem); margin: .5rem 0 1rem;
    }
    p { color: var(--ink-soft); max-width: 42ch; margin: 0 auto 2rem; line-height: 1.6; }
    a.home {
      display: inline-flex; align-items: center; gap: .5rem;
      font-family: "Spline Sans Mono", monospace; font-size: .85rem;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--link); text-decoration: none;
      padding: .7rem 1.4rem; border: 1px solid currentColor; border-radius: 999px;
      transition: background .2s, color .2s;
    }
    a.home:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você procura não existe ou foi movido. Mas há muito a explorar no diretório.</p>
    <a class="home" href="/">← Voltar ao início</a>
  </main>
</body>

</html>
